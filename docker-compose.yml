services:
  postgres:
    image: postgres:15-alpine
    container_name: myestro-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: myestro
      POSTGRES_PASSWORD: myestro_password
      POSTGRES_DB: myestro
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myestro"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - myestro-net

  redis:
    image: redis:7-alpine
    container_name: myestro-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - myestro-net

  backend:
    build:
      context: ./telegram_bot
      dockerfile: backend/Dockerfile
    container_name: myestro-backend
    restart: unless-stopped
    ports:
      - "8002:8000"
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgresql://myestro:myestro_password@postgres:5432/myestro
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - myestro-net

  bot:
    build:
      context: ./telegram_bot
      dockerfile: bot/Dockerfile
    container_name: myestro-bot
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      BACKEND_API_URL: http://backend:8002
      DATABASE_URL: postgresql+asyncpg://myestro:myestro_password@postgres:5432/myestro
      REDIS_URL: redis://redis:6379/0
      BACKEND_URL: http://backend:8000
      API_BASE_URL: http://backend:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - myestro-net

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8002
    container_name: myestroeco-admin
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_ADMIN_PASSWORD: admin123
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - myestro-net

  exam:
    build:
      context: ./exam
    container_name: maestro-exam
    restart: unless-stopped
    ports:
      - "3003:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8002
    depends_on:
      - backend
    networks:
      - myestro-net

volumes:
  postgres_data:
  redis_data:

networks:
  myestro-net:
    driver: bridge
