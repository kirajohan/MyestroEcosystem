# Railway.app Configuration for Myestro Platform
# Deploys FastAPI backend + Telegram bot + Next.js admin panel

[build]
  # Build settings for all services
  builder = "dockerfile"
  
[[services]]
  # FastAPI Backend Service
  name = "myestro-backend"
  dockerfile = "Dockerfile.backend"
  startCommand = "cd telegram_bot/backend && python -m uvicorn app.main:app --host 0.0.0.0 --port ${PORT}"
  healthchecks = ["/health"]
  
  [services.variables]
    # Python runtime
    PYTHONUNBUFFERED = "1"
    PYTHONPATH = "/app/telegram_bot"
    
    # Database
    DATABASE_URL = "${{ Railway.PostgreSQL.URL }}"
    REDIS_URL = "${{ Railway.Redis.URL }}"
    
    # API
    API_BASE_URL = "${{ services.myestro-backend.public.url }}"
    API_PORT = "${PORT}"
    
    # Security
    SECRET_KEY = "${{ secret('SECRET_KEY') }}"
    ORIGINS = "https://admin.myestro.uz,https://myestro.uz"
  
  [services.volumes]
    # Persistent uploads
    source = "/app/uploads"
    path = "/app/uploads"

[[services]]
  # Telegram Bot Service (async worker)
  name = "myestro-bot"
  dockerfile = "Dockerfile.bot"
  startCommand = "cd telegram_bot && python -m bot.main"
  healthchecks = []  # No HTTP health check for bot
  
  [services.variables]
    # Bot configuration
    BOT_TOKEN = "${{ secret('BOT_TOKEN') }}"
    API_BASE_URL = "${{ services.myestro-backend.public.url }}"
    REDIS_URL = "${{ Railway.Redis.URL }}"
    DATABASE_URL = "${{ Railway.PostgreSQL.URL }}"
    
    # Channel
    CHANNEL_USERNAME = "myestro_uz"
    CHANNEL_ID = "${{ secret('CHANNEL_ID') }}"
    
    # Settings
    BOT_GLOBAL_ENABLED = "true"
    AI_GLOBAL_ENABLED = "true"
    ADMIN_IDS = "${{ secret('ADMIN_IDS') }}"
    
    # AI
    OPENROUTER_API_KEY = "${{ secret('OPENROUTER_API_KEY') }}"
    
    # Logging
    LOG_LEVEL = "INFO"

[[services]]
  # Next.js Admin Panel
  name = "myestro-admin"
  dockerfile = "Dockerfile.admin"
  startCommand = "cd admin && npm run start"
  
  [services.variables]
    # Next.js
    NEXT_PUBLIC_API_URL = "${{ services.myestro-backend.public.url }}"
    NEXT_PUBLIC_BOT_USERNAME = "myestro_bot"
    NODE_ENV = "production"

[[databases]]
  # PostgreSQL Database
  name = "PostgreSQL"
  
[[caches]]
  # Redis Cache
  name = "Redis"

[[plugins]]
  # Auto-scaling (optional)
  name = "AutoScale"
  config = {
    min_replicas = 1,
    max_replicas = 3,
    cpu_threshold = 70,
  }
